name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 구글 뉴스 갱신
        id: news
        continue-on-error: true
        run: node tools/update-news.mjs

      - name: 바뀐 기사 커밋
        if: steps.news.outputs.changed == 'true'
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "news: 부캉이 주요 뉴스 갱신"
          git push

      - name: 배포 파일 모으기
        run: |
          mkdir -p _site
          rsync -a --exclude ".git" --exclude ".github" --exclude "tools" --exclude "_site" --exclude "README.md" ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
